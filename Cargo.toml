[package]
name = "discodex"
version = "1.1.2"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
exclude = ["third_party/codex/codex-rs"]

[lib]
name = "discodex"
path = "src/lib.rs"

[[bin]]
name = "discodex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
opus2 = "0.4.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
resvg = "0.48.1"
png = "0.18"
fontdb = "0.24"
unicode-segmentation = "1.13"
unicode-width = "0.2"
percent-encoding = "2.3.2"
url = "2.5.8"
codex-uds = { path = "third_party/codex/codex-rs/uds" }
codex-utils-pty = { path = "third_party/codex/codex-rs/utils/pty" }
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }
vt100 = "0.16.2"
futures-util = "0.3"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.4", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }
symphonia-core = "0.5.2"
symphonia = { version = "0.5.2", default-features = false, features = ["pcm", "wav"] }
sha2 = "0.10"
songbird = { version = "0.6.0", default-features = false, features = ["driver", "gateway", "receive", "rustls", "serenity", "tungstenite"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
rtc = "=0.20.5"
webrtc = "=0.20.5"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
