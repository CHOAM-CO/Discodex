name: Build Discodex worker artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build worker ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: discodex-build-linux
            suffix: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            suffix: ''
          - target: x86_64-pc-windows-msvc
            runner: discodex-build-windows
            suffix: .exe
    env:
      LIBOPUS_BUNDLED: '1'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          'GIT_CONFIG_COUNT=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'GIT_CONFIG_KEY_0=core.longpaths' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'GIT_CONFIG_VALUE_0=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check out selected ref and Codex submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          clean: ${{ runner.environment == 'github-hosted' }}
      - name: Limit Windows compilation to sixteen parallel jobs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          'CARGO_BUILD_JOBS=16' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CMAKE_BUILD_PARALLEL_LEVEL=16' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Limit Linux compilation to eight parallel jobs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'CARGO_BUILD_JOBS=8' >> "$GITHUB_ENV"
          echo 'CMAKE_BUILD_PARALLEL_LEVEL=8' >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Configure the official MSVC environment
        if: runner.os == 'Windows'
        uses: ./third_party/codex/.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Install Linux package dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils pkg-config libcap-dev libssl-dev
      - name: Build Discodex worker
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"
      - name: Prepare worker artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          name="discodex-${TARGET}${SUFFIX}"
          source="target/${TARGET}/release/discodex${SUFFIX}"
          test -f "$source"
          cp "$source" "$name"
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$name"; fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name" > "${name}.sha256"
          else
            shasum -a 256 "$name" > "${name}.sha256"
          fi
      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: discodex-worker-${{ matrix.target }}
          path: |
            discodex-${{ matrix.target }}${{ matrix.suffix }}
            discodex-${{ matrix.target }}${{ matrix.suffix }}.sha256
          if-no-files-found: error
          retention-days: 7
