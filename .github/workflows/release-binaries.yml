name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to receive the verified build assets
        required: true
        type: string
      reuse_runtime_tag:
        description: Optional release tag whose matching Codex runtime archive can be reused
        required: false
        type: string
      platform_os:
        description: Optional OS to rebuild (linux, macos, windows); blank builds all
        required: false
        type: string
      target:
        description: Optional single target triple to rebuild; blank builds the selected OS targets
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-platforms:
    runs-on: macos-15
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - id: platforms
        shell: bash
        env:
          PLATFORM_OS: ${{ inputs.platform_os }}
          BUILD_TARGET: ${{ inputs.target }}
        run: echo "matrix=$(python3 scripts/product_resources.py release-matrix --os "$PLATFORM_OS" --target "$BUILD_TARGET")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: resolve-platforms
    env:
      LIBOPUS_BUNDLED: '1'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTUP_TOOLCHAIN: '1.95.0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-platforms.outputs.matrix).include }}
    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          'GIT_CONFIG_COUNT=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'GIT_CONFIG_KEY_0=core.longpaths' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'GIT_CONFIG_VALUE_0=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check out requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          submodules: recursive
          clean: ${{ runner.environment == 'github-hosted' }}
      - name: Limit Windows compilation to sixteen parallel jobs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          'CARGO_BUILD_JOBS=16' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CMAKE_BUILD_PARALLEL_LEVEL=16' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Limit Linux compilation to eight parallel jobs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'CARGO_BUILD_JOBS=8' >> "$GITHUB_ENV"
          echo 'CMAKE_BUILD_PARALLEL_LEVEL=8' >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure the official MSVC host environment
        if: runner.os == 'Windows'
        uses: ./third_party/codex/.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Use native MSVC linkers for host and target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $HostLinker = (Resolve-Path (Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe')).Path
          $ArmLinker = (Resolve-Path (Join-Path $env:VCToolsInstallDir 'bin/Hostx64/arm64/link.exe')).Path
          'VSCMD_ARG_TGT_ARCH=x64' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSINSTALLDIR=$((Get-Item $env:VCINSTALLDIR).Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$HostLinker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$ArmLinker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Confirm release tag matches the worker runtime version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected} for this worker and runtime")
          PY
      - name: Install official Linux package dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils pkg-config libcap-dev libssl-dev
      - name: Cache Rust build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            third_party/codex/codex-rs -> target
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @('scripts/install.ps1', 'scripts/update.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            $path = Join-Path $PWD $file
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Build the pinned Codex package with official packaging
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CODEX_REPO_ROOT: ${{ github.workspace }}/third_party/codex
          REUSE_RUNTIME_TAG: ${{ inputs.reuse_runtime_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf -- runtime-package
          rm -f -- "discodex-runtime-${TARGET}.tar.gz" "discodex-runtime-${TARGET}.json"
          STABLE_GIT_COMMIT="$(git -C third_party/codex rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          if [[ -n "$REUSE_RUNTIME_TAG" ]]; then
            gh release download "$REUSE_RUNTIME_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "discodex-runtime-${TARGET}.tar.gz" \
              --pattern "discodex-runtime-${TARGET}.json" \
              --dir .
            python scripts/runtime-manifest.py \
              --target "$TARGET" \
              --package runtime-package \
              --extract-archive "discodex-runtime-${TARGET}.tar.gz" \
              --reuse-manifest "discodex-runtime-${TARGET}.json"
          else
            # rust-cache prunes gn_out but retains V8's build-script fingerprint.
            # Let the official build script restore its verified native archive.
            if [[ '${{ runner.environment }}' == 'github-hosted' ]]; then
              cargo clean --manifest-path third_party/codex/codex-rs/Cargo.toml \
                --package v8 --target "$TARGET" --release
            fi
            python third_party/codex/scripts/build_codex_package.py \
              --variant codex --target "$TARGET" --cargo-profile release \
              --package-dir "runtime-package" \
              --archive-output "discodex-runtime-${TARGET}.tar.gz"
            python scripts/runtime-manifest.py --target "$TARGET" --package runtime-package
          fi
      - name: Prepare release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          name="discodex-${TARGET}${SUFFIX}"
          source="target/${TARGET}/release/discodex${SUFFIX}"
          test -f "$source"
          cp "$source" "$name"
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$name"; fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name" > "${name}.sha256"
          else
            shasum -a 256 "$name" > "${name}.sha256"
          fi
      - name: Upload runner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            discodex-${{ matrix.target }}${{ matrix.suffix }}
            discodex-${{ matrix.target }}${{ matrix.suffix }}.sha256
            discodex-runtime-${{ matrix.target }}.tar.gz
            discodex-runtime-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7

  package-installers:
    name: Package source-free installers
    needs: build
    runs-on: discodex-build-linux
    steps:
      - name: Check out requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          clean: false
      - name: Package installer scripts only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/product_resources.py generate
          rm -f -- discodex-installers.zip
          zip -q discodex-installers.zip install update scripts/install.sh scripts/install.ps1 scripts/update.sh scripts/update.ps1 scripts/product.generated.sh scripts/product.generated.ps1
          sha256sum discodex-installers.zip > discodex-installers.zip.sha256
      - name: Upload installer bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-installers
          path: |
            discodex-installers.zip
            discodex-installers.zip.sha256
          if-no-files-found: error
          retention-days: 7

  upload-draft:
    name: Upload to draft release
    needs: [build, package-installers]
    runs-on: discodex-build-linux
    permissions:
      contents: write
    steps:
      - name: Clear previous release upload staging
        shell: bash
        run: rm -rf -- release-assets
      - name: Download runner artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Confirm target release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG does not exist as a draft." >&2
            exit 1
          fi
      - name: Upload assets without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo 'No build artifacts were downloaded.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
